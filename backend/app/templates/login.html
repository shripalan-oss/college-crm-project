{% extends "base.html" %}

{% block title %}Login - Collab CRM{% endblock %}

{% block content %}
<style>
    body {
        background-image: url("{{ url_for('static', filename='images/bg.jpg') }}");
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
    }
    .login-container {
        max-width: 450px;
        margin: 80px auto;
        background-color: rgba(255, 255, 255, 0.92);
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 8px 16px rgba(0,0,0,0.2);
    }
    .login-header {
        text-align: center;
        margin-bottom: 30px;
    }
    .login-header img {
        width: 80px;
        border-radius: 10px;
        margin-bottom: 15px;
    }
    .login-header h2 {
        color: #004085;
        font-weight: bold;
    }
</style>

<div class="login-container">
    <div class="login-header">
        <img src="{{ url_for('static', filename='images/logo.jpg') }}" alt="CRM Logo">
        <h2>Student CRM Login</h2>
        <p class="text-muted">Welcome back! Please login to your account.</p>
    </div>

    <form method="POST">
        <div class="mb-3">
            <label class="form-label fw-bold">Email Address</label>
            <input type="email" name="email" class="form-control" placeholder="student@university.edu" required>
        </div>
        <div class="mb-4">
            <label class="form-label fw-bold">Password</label>
            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>
        <div class="d-grid gap-2">
            <button type="submit" class="btn btn-primary btn-lg" style="background-color: #004085;">Log In</button>
        </div>
    </form>
    
    <div class="text-center mt-4">
        <p>Don't have an account? <a href="/register" style="color: #004085; font-weight: bold;">Register here</a></p>
    </div>
</div>
{% endblock %}
